"İletişim" = ["Teams", "Outlook"]

# ---------------------------------------------------------------------
#  Günlük hedef: seri (üst üste kaç gün hedefe ulaşıldı) hesabında kullanılır.
# ---------------------------------------------------------------------
[hedef]
gunluk_dk = 120

# ---------------------------------------------------------------------
#  Öğrenen tahmin: düzelttiğin (ve kuralların karar verdiği) tarayıcı başlıklarındaki
#  kelimelerden öğrenir; benzer, hiç görülmemiş başlıklar için tahmin yürütür.
#  Tamamen bu bilgisayarda çalışır, model dosyaya kaydedilmez.
# ---------------------------------------------------------------------
[tahmin]
etkin = true             # Düzeltme ekranında "Tahmin: çalışma %87" önerileri gösterilsin
otomatik_karar = false   # true: kuralların karar veremediği başlıklarda tahmin KARAR VERSİN
esik_yuzde = 90          # Otomatik karar için en az bu kadar emin olmalı (50-99)

# ---------------------------------------------------------------------
#  Paylaşım kartı
# ---------------------------------------------------------------------
[kart]
ust_metin = "Heatmap"      # Kartın sol üstündeki yazı (örn. adın); büyük harfle, en fazla 22 harf

# ---------------------------------------------------------------------
#  Otomatik yedek: her gün data/yedek/heatmap-YYYY-AA-GG.db oluşturulur.
#  Geri dönmek için: Heatmap'i kapat, istediğin yedeği data/heatmap.db adıyla kopyala.
# ---------------------------------------------------------------------
[yedek]
etkin = true
saklanacak_gun = 7

# ---------------------------------------------------------------------
#  Modül 5 - Tarayıcı eklentisi (eklenti/ klasörü; kurulumu eklenti/README.md)
#  Eklenti kurulu değilse bu modül zararsızdır: "eklentiden haber yok" der.
# ---------------------------------------------------------------------
[tarayici]
etkin = true

# ---------------------------------------------------------------------
#  Modül 3 - Klavye/fare boşta kalma
# ---------------------------------------------------------------------
[bosta]
etkin = true
esik_sn = 120          # Bu kadar süre klavye/fare kullanılmazsa "bilgisayar başında değil"
video_esik_sn = 1800   # Video izlerken eşik (30 dk). Ders videosunda fareye dokunmazsın.

# ---------------------------------------------------------------------
#  Modül 4 - Kamera (isteğe bağlı; kurulum: kamera_isci/README.md)
#  Görüntü ASLA kaydedilmez/gönderilmez; yalnızca "yüz var mı, kafa açısı" sonucu kullanılır.
# ---------------------------------------------------------------------
[kamera]
etkin = false              # Kurulumdan sonra true yap
kare_araligi_sn = 2        # Kaç saniyede bir kare analiz edilsin
kamera_no = 0              # Birden çok kamera varsa 1, 2...
model = "modeller/face_landmarker.task"
python = ""                # Boşsa .venv-kamera kullanılır (kamera_kur.bat kurar)
yuz_yok_esik_sn = 30       # Yüz bu kadar görünmezse (ve klavye/fare boştaysa) sayaç durur
telefon_esik_sn = 20       # Telefon bu kadar görülürse sayaç durur
not_alma_esik_sn = 600     # Klavye boşken kafa bu kadar aşağıdaysa süre "belirsiz" olur
ekran_pitch = 0.0          # Kalibrasyon: ekrana normal bakarkenki açı (Kamera satırında görünür)
asagi_fark_derece = 18     # ekran_pitch'ten bu kadar aşağısı "aşağı bakıyor"
sahte_senaryo = ""         # Kamerasız deneme: "masada", "yok", "not_aliyor", "telefon"
