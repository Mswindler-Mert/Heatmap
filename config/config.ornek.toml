"Belge ve not" = ["Word", "PowerPoint", "Excel", "OneNote", "Access", "Adobe Reader", "Adobe Acrobat",
                  "SumatraPDF", "Foxit Reader", "Goodnotes", "iLovePDF", "Not Defteri",
                  "Google Docs", "Google Drive", "Wikipedia", "DeepL"]
