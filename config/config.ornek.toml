# ---------------------------------------------------------------------
#  Kategoriler: "Süre nereden geldi?" bölümünde süreyi gruplamak için.
#  Sol taraf kategori adı, sağ taraf dökümde görünen adlar ([adlar] ve [siteler]
#  sonucu; büyük/küçük harf önemsiz). Hiçbir kategoride olmayanlar "Diğer" olur.
#  config.toml'a yazdığın kategori, buradaki aynı adlı kategorinin YERİNE geçer.
# ---------------------------------------------------------------------
[kategoriler]
"Kod" = ["VS Code", "Visual Studio", "IntelliJ IDEA", "PyCharm", "CLion", "NetBeans", "Antigravity",
         "Unity", "Unity Hub", "GitHub Desktop", "Terminal", "PowerShell", "Git Bash",
         "GitHub", "Stack Overflow", "GeeksforGeeks"]
